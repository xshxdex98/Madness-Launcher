name: Publish news feed

# Regenerates news.json from Discord and YouTube and commits it when it has
# changed. The launcher fetches the committed file; nothing about this workflow
# is exposed to users beyond that one JSON file.

on:
  schedule:
    # Every 15 minutes. GitHub's scheduler is best-effort and runs late under
    # load, so treat this as "about every quarter hour", not a guarantee.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# Only the commit needs write access; nothing else in the repository is touched.
permissions:
  contents: write

concurrency:
  # A slow run must not overlap the next tick and race it to the same commit.
  group: news-feed
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build news.json
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          python tools/newsbot/build_news.py \
            --config tools/newsbot/sources.json \
            --out news.json

      - name: Commit if the feed changed
        run: |
          # Staged first, then compared against HEAD. Comparing the working
          # tree instead (git diff -- news.json) silently does nothing on the
          # very first run: the file is untracked at that point, and git diff
          # does not look at untracked files, so it reports no change and the
          # feed never gets committed at all.
          git add news.json
          if git diff --cached --quiet -- news.json; then
            echo "No change."
            exit 0
          fi
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git commit -m "news: refresh feed"
          # Another tick may have landed a commit while this one was building.
          git pull --rebase --autostash
          git push
